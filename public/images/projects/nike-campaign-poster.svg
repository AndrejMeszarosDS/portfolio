<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004E89;stop-opacity:1" />
    </linearGradient>
    <filter id="blur"><feGaussianBlur in="SourceGraphic" stdDeviation="4" /></filter>
  </defs>
  
  <!-- Background gradient -->
  <rect width="1920" height="1080" fill="url(#mainGrad)"/>
  
  <!-- Blurred circles for depth -->
  <circle cx="1700" cy="200" r="250" fill="rgba(255,255,255,0.15)" filter="url(#blur)"/>
  <circle cx="200" cy="800" r="300" fill="rgba(255,255,255,0.1)" filter="url(#blur)"/>
  <circle cx="960" cy="500" r="200" fill="rgba(0,0,0,0.2)" filter="url(#blur)"/>
  
  <!-- Decorative lines -->
  <line x1="100" y1="250" x2="600" y2="250" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
  <line x1="1320" y1="830" x2="1820" y2="830" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Main text -->
  <text x="960" y="420" font-size="140" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="2">
    Nike
  </text>
  
  <!-- Subtitle -->
  <text x="960" y="600" font-size="70" fill="rgba(255,255,255,0.95)" text-anchor="middle" font-family="Arial, sans-serif" font-weight="300">
    Nike Campaign
  </text>
  
  <!-- Bottom accent bar -->
  <rect x="500" y="950" width="920" height="6" fill="rgba(255,255,255,0.7)" rx="3"/>
</svg>