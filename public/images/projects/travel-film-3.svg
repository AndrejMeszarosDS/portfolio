<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="galleryGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A86B;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#galleryGrad3)"/>
  
  <!-- Geometric frame -->
  <rect x="200" y="150" width="500" height="500" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  <rect x="210" y="160" width="480" height="480" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Right frame -->
  <rect x="1220" y="430" width="500" height="500" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  <rect x="1230" y="440" width="480" height="480" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Center showcase box -->
  <rect x="600" y="250" width="720" height="580" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="4" rx="8"/>
  <rect x="620" y="270" width="680" height="540" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="6"/>
  
  <!-- Gallery label -->
  <text x="960" y="480" font-size="100" font-weight="bold" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-family="Arial, sans-serif">
    Gallery 3
  </text>
  
  <!-- Image counter -->
  <text x="960" y="680" font-size="50" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-family="Arial, sans-serif">
    Travel Film - Part 3
  </text>
</svg>